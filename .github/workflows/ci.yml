name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret-scan (waterworks#938), zelfde opzet als de job `gitleaks` in
  # waterworks (ww#820; uitleg in docs/gitleaks.md daar). Bij een PR alleen de
  # commits van de PR, bij push en handmatig starten de huidige bestanden.
  # Gitleaks als CLI met vaste versie en checksum: de gitleaks-action vraagt
  # voor organisaties een licentiesleutel. Vals-positief op één regel: zet
  # `gitleaks:allow` als commentaar op die regel.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Installeer gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan op secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "scan van de PR-commits $BASE..$HEAD"
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="$BASE..$HEAD" .
          else
            echo "$EVENT: scan van de huidige bestanden"
            "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose .
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Zelfde ruff-versie als in pixi.toml (dev) en de waterworks-CI.
      - name: Install ruff (pinned)
        run: pipx install ruff==0.16.3
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Er is geen sibling-checkout ../rgs-django-utils in CI. Zonder committe
      # lockfile solvet pixi ook de default/dev-env, die die editable path-dep
      # vereist → canonicalization-fout. Strip de dev-path-regel vóór install
      # (zelfde patroon als de consumer-Dockerfiles); prod haalt utils uit git.
      - name: Strip dev-only path dep (utils komt in prod uit git)
        run: sed -i '/^rgs-django-utils = { path =/d' pixi.toml
      # prod-solve-group: rgs-django-utils via git (geen sibling-checkout in CI)
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: prod
          cache: false
      - run: pixi run -e prod python -m pytest tests/ -v
      # Dezelfde suite op PostgreSQL: de tests met een SpatialLayer (ArrayField)
      # en de trigger spatial_layer_style_scope (urbanworks#433) bestaan alleen
      # daar en worden op SQLite overgeslagen.
      - name: pytest op PostgreSQL
        run: pixi run -e prod python -m pytest tests/ --ds=testapp.settings_postgres
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      # Bewaakt dat modelwijzigingen altijd in een migratie zitten (final-review
      # Important 2). --skip-checks is nodig omdat de sqlite-testsettings
      # 'django.contrib.postgres' niet in INSTALLED_APPS hebben (nodig voor
      # ArrayField op EnumMapAuthTypeExtended/-SourceTypeExtended/SpatialLayer/
      # SpatialMap, postgres.E005) — een pre-existing system-check, los van dit
      # ticket; migraties zelf worden hier niet overgeslagen.
      - name: Check for missing migrations
        run: >-
          PYTHONPATH=tests DJANGO_SETTINGS_MODULE=testapp.settings_test
          pixi run -e prod python -m django makemigrations --check --dry-run --skip-checks rgs_django_spatial
      # Het pk-type van de migraties mag niet van DEFAULT_AUTO_FIELD van het
      # project afhangen (#16): ook schoon in een project met AutoField (drainworks).
      - name: Check for missing migrations (project met AutoField)
        run: >-
          PYTHONPATH=tests DJANGO_SETTINGS_MODULE=testapp.settings_autofield
          pixi run -e prod python -m django makemigrations --check --dry-run --skip-checks rgs_django_spatial

  dev-config:
    # Gedeelde dev-config-afspraken (ruff-kopie, editorconfig, Dependabot) uit
    # GetThePointGit/rgs-dev-config; zie docs/dependencies.md daar. Deze repo is
    # publiek en mag de herbruikbare workflow dev-config-check.yml uit die
    # (private) repo niet aanroepen ("workflow file issue", geen jobs); daarom
    # dezelfde stap hier inline. De CLI komt uit GitHub Packages: het
    # Actions-secret GH_PAT_RGS_LIBS (read:packages) moet voor deze repo
    # beschikbaar zijn.
    name: rgs-config check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@getthepointgit"
      - run: npx --yes --package @getthepointgit/dev-config@latest -- rgs-config check --dir . --strict
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_RGS_LIBS }}
